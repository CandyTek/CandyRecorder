plugins {
	id 'com.android.application'
}

android {
	namespace 'com.candytek.recorder'
	compileSdk 34

	defaultConfig {
		applicationId "com.candytek.recorder"
		minSdk 21
		//noinspection ExpiredTargetSdkVersion
		targetSdk 29
		versionCode 1
		versionName "1.0"
	}

	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
	buildFeatures {
		buildConfig true
	}
	lint {
		// CAPTURE_AUDIO_OUTPUT is a signature permission: only effective on privileged/system builds.
		disable 'ProtectedPermissions'
	}
}

dependencies {
	implementation 'androidx.annotation:annotation:1.7.0'
}
